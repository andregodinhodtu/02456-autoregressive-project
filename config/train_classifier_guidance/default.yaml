defaults:
  - head: head_ffnn
  - optimizer: adam
  - loss_fn: cross_entropy
  - _self_

trained_model:
  name: ???            # folder in results/models/, e.g. transformer/best

seed: 42

data:
  train: data/train.csv
  val: data/val.csv

train:
  batch_size: 64
  epochs: 10
  val_every_step: 50

hydra:
  run:
    dir: results/train_classifier_guidance/runs/${trained_model.name}_${hydra:runtime.choices.head}_${hydra.job.override_dirname}
  sweep:
    dir: results/train_classifier_guidance/sweeps
    subdir: ${trained_model.name}_${hydra:runtime.choices.head}_${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [trained_model.name, trained_model.group, head]
  job_logging:
    formatters:
      simple:
        format: "%(message)s"

