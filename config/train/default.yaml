defaults:
  - model: ???
  - optimizer: adam
  - loss_fn: cross_entropy
  - _self_

seed: 42

data:
  train: data/train.csv
  val: data/val.csv

train:
  batch_size: 64
  epochs: 10
  val_every_step: 50

hydra:
  run:
    dir: results/train/runs/${hydra:runtime.choices.model}/${hydra.job.override_dirname}
  sweep:
    dir: results/train/sweeps/${hydra.job.override_dirname}
  job_logging:
    formatters:
      simple:
        format: "%(message)s"
