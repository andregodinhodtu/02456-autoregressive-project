defaults:
  - model: ???
  - optimizer: adam
  - loss_fn: cross_entropy
  - _self_

seed: 42

data:
  train: data/train.csv
  val: data/val.csv
  test: data/test.csv

train:
  batch_size: 64
  epochs: 10
  val_every_step: 50

hydra:
  run:
    dir: results/runs/${hydra:runtime.choices.model}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: results/sweeps/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job_logging:
    formatters:
      simple:
        format: "%(message)s"
