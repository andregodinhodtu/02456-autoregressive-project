defaults:
  - _self_

trained_model:
  name: ???

seed: 42

data:
  train: data/train.csv
  
generate:
  batch_size: 256

hydra:
  run:
    dir: results/generative/runs/${trained_model.name}/${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys: [trained_model.name]
  job_logging:
    formatters:
      simple:
        format: "%(message)s"