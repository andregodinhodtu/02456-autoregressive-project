model:
  _target_: protgen.models.mlp.MLPLM
  context: 3
  stride: 1
  d_emb: 64
  d_hidden: 512
  pad_id: 0
  dropout: 0.1
optimizer:
  _target_: torch.optim.Adam
  lr: 0.0003
loss_fn:
  _target_: torch.nn.CrossEntropyLoss
seed: 3
data:
  train: data/train.csv
  val: data/val.csv
train:
  batch_size: 64
  epochs: 100
  val_every_step: 20
