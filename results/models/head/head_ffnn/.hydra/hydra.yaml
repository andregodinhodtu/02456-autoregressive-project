hydra:
  run:
    dir: results/train_classifier_guidance/runs/${trained_model.name}/${hydra:runtime.choices.head}/${hydra.job.override_dirname}
  sweep:
    dir: results/train_classifier_guidance/sweeps
    subdir: ${trained_model.name}/${hydra:runtime.choices.head}/${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '%(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - trained_model.name=transformer/best_transformer
  job:
    name: train_classifier_guidance
    chdir: null
    override_dirname: ''
    id: ???
    num: ???
    config_name: default
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys:
        - trained_model.name
        - head
  runtime:
    version: 1.3.8
    version_base: '1.3'
    cwd: /Users/andregodinho/Documents/GitHub/02456-autoregressive-project
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /Users/andregodinho/Documents/GitHub/02456-autoregressive-project/config/train_classifier_guidance
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /Users/andregodinho/Documents/GitHub/02456-autoregressive-project/results/train_classifier_guidance/runs/transformer/best_transformer/head_ffnn
    choices:
      loss_fn: cross_entropy
      optimizer: adam
      head: head_ffnn
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
